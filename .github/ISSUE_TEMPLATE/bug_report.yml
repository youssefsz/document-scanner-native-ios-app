name: Bug report
description: Report a reproducible problem in DocScanner
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Search existing issues first and never attach personal documents, passwords, encryption keys, purchase credentials, or unredacted logs. Report security vulnerabilities through SECURITY.md instead.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for this problem.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Include the version and build number from Settings when possible.
      placeholder: "2.0.0 (1)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and OS
      placeholder: "iPhone 15, iOS 26.2"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Build source
      options:
        - App Store
        - Current main branch
        - Fork or modified build
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic documents and provide the smallest reliable sequence.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Add redacted screenshots, crash details, or logs if they help. Remove personal and document data first.
